    [hidden] {

    * {

    body {

    /* Slim Frosted Glass Navbar */
    .topbar {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      height: 54px;
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: nowrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981 0%, #0071e3 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 113, 227, 0.28);
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e1;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .sync-dot.connecting {
      background: var(--warning);
    }

    .sync-dot.connected {
      background: var(--success);
      animation: pulseLive 2.4s infinite;
    }

    .sync-dot.error {
      background: var(--danger);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
